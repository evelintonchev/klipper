[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_5600300011504E5242333420-if00

[include mainsail.cfg]
[include macros.cfg]
[include timelapse.cfg]

[printer]
kinematics: cartesian
max_velocity: 150
max_accel: 1500
max_z_velocity: 30
max_z_accel: 100

[stepper_x]
step_pin: !PB5
dir_pin: PB6
enable_pin: !PB4
microsteps: 16
rotation_distance: 34
endstop_pin: PC6
# Full absolute range
# position_min: -23
# position_endstop: 251
# position_max: 251
# Safe print bed area (shared by both extruders)
position_min: -23
position_endstop: 251
position_max: 251
homing_speed: 50
second_homing_speed: 10
homing_positive_dir: true

[dual_carriage]
axis: x
safe_distance: 38
step_pin: !PC2
dir_pin: !PC3
enable_pin: !PC1
microsteps: 16
rotation_distance: 34
endstop_pin: PC7
# Full absolute range
# position_min: -24
# position_endstop: -23
# position_max: 213
# Safe print bed area (shared by both extruders)
position_min: -24
position_endstop: -23
position_max: 213
homing_speed: 50
second_homing_speed: 10

[stepper_y]
step_pin: !PF8
dir_pin: !PF9
enable_pin: !PF7
microsteps: 16
rotation_distance: 34
endstop_pin: !PG0
position_min: -3
position_endstop: -3
position_max: 152
homing_speed: 50
second_homing_speed: 10

[stepper_z]
step_pin: PF3
dir_pin: !PF4
enable_pin: !PF2
microsteps: 16
rotation_distance: 8
endstop_pin: !PG1
position_min: -1.9
#position_endstop: -1.7
position_max: 172
homing_speed: 25
second_homing_speed: 5

[bed_screws]
# Safe relative bed screw positions
screw1: 99, 80
screw1_name: Virtual Center
screw2: 99, 8
screw2_name: Center Front
screw3: 39, 143
screw3_name: Left Back
screw4: 139, 143
screw4_name: Right Back

[extruder]
step_pin: PE0
dir_pin: PE1
enable_pin: !PB9
microsteps: 16
rotation_distance: 32
nozzle_diameter: 0.4
filament_diameter: 1.75
max_extrude_only_distance: 500
heater_pin: PA3
control: pid
pid_kp: 26.814
pid_ki: 1.374
pid_kd: 130.849
sensor_type: extruder_sensors
ads1118_mux: 0
ads1118_pga: 7
ads1118_dr: 2
min_temp: 0
max_temp: 265

[extruder1]
step_pin: PE5
dir_pin: !PE6
enable_pin: !PE4
microsteps: 16
rotation_distance: 32
nozzle_diameter: 0.4
filament_diameter: 1.75
max_extrude_only_distance: 500
heater_pin: PA2
control: pid
pid_kp: 22.862
pid_ki: 1.153
pid_kd: 113.281
sensor_type: extruder_sensors
ads1118_mux: 3
ads1118_pga: 7
ads1118_dr: 2
min_temp: 0
max_temp: 265

[heater_bed]
heater_pin: PA1
control: pid
pid_kp: 70.740
pid_ki: 0.897
pid_kd: 1395.349
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
min_temp: -100
max_temp: 140

[temperature_sensor MCU]
sensor_type: temperature_mcu
min_temp: -40
max_temp: 105

[ads1118 extruder_sensors]
cs_pin: PF12
spi_bus: spi3a

[temperature_sensor Mainboard]
sensor_type: extruder_sensors_temp

[controller_fan mainboard_fan]
pin: PA0
off_below: 0.1666

[heater_fan right_extruder]
pin: PF14
max_power: 1.0
heater: extruder
heater_temp: 50.0

[heater_fan left_extruder]
pin: PB1
max_power: 1.0
heater: extruder1
heater_temp: 50.0

[fan_generic right_part_fan]
pin: PF13
max_power: 1.0

[fan_generic left_part_fan]
pin: PB0
max_power: 1.0

[led print_room]
red_pin: PG5
green_pin: PG7
blue_pin: PG6
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0

[exclude_object]

